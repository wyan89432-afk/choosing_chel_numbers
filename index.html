<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3 Digit Number Selector</title><style>body{font-family:Arial;margin:0;padding:16px;background:#f4f4f4}h1{text-align:center}.bar{display:flex;gap:8px;max-width:1000px;margin:auto auto 14px}.bar input{flex:1;padding:12px;font-size:16px;border:1px solid #aaa;border-radius:8px}.bar button{padding:12px;border:0;border-radius:8px}.wrap{overflow:auto;background:white}.fixed{border-collapse:collapse;min-width:720px;width:100%}.fixed th,.fixed td{border:1px solid #ccc;text-align:center;padding:7px;font-weight:bold}.fixed th,.fixed td:first-child{background:#eee}.y{background:#fff176}.g{background:#69f0ae}.r{background:#ff8a80}.results{max-width:1000px;margin:18px auto}.card{background:#fff;padding:12px;margin:12px 0;border-radius:10px}.card h2{margin:0 0 10px}.auto{border-collapse:collapse;width:100%}.auto td{border:1px solid #ddd;padding:8px;text-align:center;font-weight:bold}.download{float:right;padding:7px;border:0;border-radius:6px}</style></head><body><h1>🔢 000 – 999 Number Selector</h1><div class="bar"><input id="q" placeholder="🔍 top1, middle 1, last 1, or hundreds digit 1=ten digit 3"><button onclick="q.value='';render()">Clear</button></div><div class="wrap"><table class="fixed"><thead><tr><th>Row</th><script>for(let c=0;c<10;c++)document.write('<th>Column '+c+'</th>')</script></tr></thead><tbody id="body"></tbody></table></div><div class="results" id="results"></div><script>const N=Array.from({length:1000},(_,i)=>String(i).padStart(3,'0'));function rules(s){s=s.toLowerCase();let a=[];let patterns=[[/top\s*([0-9])/g,0],[/hundreds?\s+digit\s*=?\s*([0-9])/g,0],[/middle\s*([0-9])/g,1],[/ten\s+digits?\s*=?\s*([0-9])/g,1],[/last\s*([0-9])/g,2],[/unit\s+digit\s*=?\s*([0-9])/g,2]];for(const [re,p] of patterns){let m;while(m=re.exec(s))a.push([p,m[1]])}return [...new Map(a.map(x=>[x.join(':'),x])).values()]}function name(a){return a.map(x=>x[0]==0?'top'+x[1]:x[0]==1?'middle '+x[1]:'last '+x[1]).join(' = ')}function render(){let rs=rules(q.value),b=document.getElementById('body');b.innerHTML='';for(let r=0;r<100;r++){let tr=document.createElement('tr'),h=document.createElement('td');h.textContent=String(r).padStart(2,'0');tr.append(h);for(let c=0;c<10;c++){let n=N[c*100+r],td=document.createElement('td');td.textContent=n;rs.forEach(([p,d])=>{if(n[p]===d)td.classList.add(p==0?'y':p==1?'g':'r')});tr.append(td)}b.append(tr)}let out=document.getElementById('results');out.innerHTML='';if(!rs.length)return;let list=N.filter(n=>rs.every(([p,d])=>n[p]===d)),card=document.createElement('div');card.className='card';card.innerHTML='<button class="download">⬇ Download</button><h2>'+name(rs)+'</h2>';let t=document.createElement('table');t.className='auto';list.forEach(n=>{let tr=document.createElement('tr');tr.innerHTML='<td>'+n+'</td>';t.append(tr)});card.append(t);card.querySelector('.download').onclick=()=>{let txt=name(rs)+'\n'+list.join('\n'),blob=new Blob([txt],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name(rs).replace(/\s+/g,'_')+'.txt';a.click()};out.append(card)}q.addEventListener('input',render);render();</script></body></html>
