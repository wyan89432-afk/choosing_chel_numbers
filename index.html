<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3 Digit Number Selector</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;padding:12px;background:#f4f4f4;color:#111}h1{text-align:center;font-size:clamp(20px,4vw,30px)}.bar{display:flex;gap:8px;max-width:1100px;margin:0 auto 14px}.bar input{min-width:0;flex:1;padding:12px;font-size:16px}.bar button{padding:12px 14px}.wrap{width:100%;overflow-x:auto;background:#fff;border-radius:8px}.fixed{border-collapse:collapse;width:100%;table-layout:fixed;min-width:620px}.fixed th,.fixed td{border:1px solid #bbb;text-align:center;padding:7px 2px;font-weight:bold;font-size:clamp(11px,1.8vw,15px);white-space:nowrap}.fixed th,.fixed td:first-child{background:#eee}.y{background:#fff176!important}.g{background:#69f0ae!important}.r{background:#ff8a80!important}.results{max-width:1100px;margin:18px auto}.card{background:#fff;padding:12px;margin:12px 0;border-radius:10px;overflow:hidden}.count{font-size:18px;font-weight:bold;margin:10px 0}.auto{border-collapse:collapse;width:100%}.auto td{border:1px solid #ccc;text-align:center;padding:7px;font-weight:bold}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.actions button{padding:9px 12px}@media(max-width:560px){body{padding:8px}.bar{gap:5px}.bar button{padding:10px 8px;font-size:12px}.fixed{min-width:0}.fixed th,.fixed td{padding:5px 1px;font-size:11px}.fixed th:first-child,.fixed td:first-child{width:34px}}</style></head><body><h1>🔢 000 – 999 Number Selector</h1><div class="bar"><input id="q" placeholder="🔍 H,T,4=T,U,6 | H,U,5P3 | H,T,6=BK0"><button id="searchBtn">🔍 Search</button><button id="clearBtn">Clear</button></div><div class="wrap"><table class="fixed"><thead><tr><th>Row</th><script>for(let c=0;c<10;c++)document.write('<th>Column '+c+'</th>')</script></tr></thead><tbody id="body"></tbody></table></div><div class="results" id="results"></div><script>const N=Array.from({length:1000},(_,i)=>String(i).padStart(3,'0')),names=['hundreds','ten','unit'];let searched='';const pos=x=>/^(h|hd)$/i.test(x)?0:/^(t|td)$/i.test(x)?1:2,mod10=x=>((x%10)+10)%10,total=n=>(+n[0]+ +n[1]+ +n[2])%10;function basic(s){let a=[],m,ps=[[/top\s*([0-9])/gi,0],[/hundreds?\s+digits?\s*=?\s*([0-9])/gi,0],[/\bhd\s*([0-9])/gi,0],[/middle\s*([0-9])/gi,1],[/ten\s+digits?\s*=?\s*([0-9])/gi,1],[/\btd\s*([0-9])/gi,1],[/last\s*([0-9])/gi,2],[/unit\s+digits?\s*=?\s*([0-9])/gi,2],[/\bud\s*([0-9])/gi,2]]);for(let [re,p] of ps)while(m=re.exec(s))a.push([p,m[1]]);return a}function chained(s){let a=[],re=/\b(h|t|u|hd|td|ud)\s*,\s*([0-9])\s*=\s*(h|t|u|hd|td|ud)\s*,\s*([0-9])\b/gi,m;while(m=re.exec(s)){let p1=pos(m[1]),p2=pos(m[3]);if(p1!==p2)a.push({p1,p2,sum1:+m[2],sum2:+m[4],raw:m[0]})}return a}function pairs(s){let a=[],re=/\b(h|t|u|hd|td|ud)\s*,\s*(h|t|u|hd|td|ud)\s*,\s*([0-9])\s*(?:p\s*([0-9]))?(?:\s*=\s*bk\s*([0-9]))?/gi,m;while(m=re.exec(s)){let p1=pos(m[1]),p2=pos(m[2]);if(p1!==p2)a.push({p1,p2,sum:+m[3],p:m[4],bk:m[5]})}return a}function render(){let s=searched,bs=basic(s),chs=chained(s),stand=s.replace(/\b(h|t|u|hd|td|ud)\s*,\s*[0-9]\s*=\s*(h|t|u|hd|td|ud)\s*,\s*[0-9]\b/gi,''),prs=pairs(stand),bk=/\bbk\s*([0-9])\b/i.exec(s),b=document.getElementById('body');b.innerHTML='';for(let r=0;r<100;r++){let tr=document.createElement('tr'),h=document.createElement('td');h.textContent=String(r).padStart(2,'0');tr.append(h);for(let c=0;c<10;c++){let n=N[c*100+r],td=document.createElement('td');td.textContent=n;bs.forEach(([p,d])=>{if(n[p]===d)td.classList.add(['y','g','r'][p])});tr.append(td)}b.append(tr)}let list=N.filter(n=>bs.every(([p,d])=>n[p]===d)&&prs.every(x=>mod10(+n[x.p1]+ +n[x.p2])===x.sum)&&chs.every(x=>mod10(+n[x.p1]+ +n[x.p2])===x.sum1&&mod10(+n[x.p2]+ +n[2])===x.sum2)&&(!bk||total(n)===+bk[1]));if(!bs.length&&!prs.length&&!chs.length&&!bk)return;let title=chs.map(x=>x.raw).join(' = ')||prs.map(x=>names[x.p1]+'+'+names[x.p2]+'='+x.sum+(x.p?'P'+x.p:'')+(x.bk?'=BK'+x.bk:'')).join(' = ')||bs.map(x=>names[x[0]]+' digit '+x[1]).join(' = ')||(bk?'BK'+bk[1]:'Results');let card=document.createElement('div');card.className='card';card.innerHTML='<h2>'+title+' Table</h2><div class="count">စုစုပေါင်း Number: '+list.length+' ခု</div>';let actions=document.createElement('div');actions.className='actions';let dl=document.createElement('button');dl.textContent='⬇️ Download black PNG';dl.onclick=()=>downloadPNG(title,list);actions.append(dl);card.append(actions);let t=document.createElement('table');t.className='auto';list.forEach(n=>{let tr=document.createElement('tr');tr.innerHTML='<td>'+n+'</td>';t.append(tr)});card.append(t);document.getElementById('results').append(card)}function downloadPNG(title,list){let w=900,rowH=34,h=100+list.length*rowH,cv=document.createElement('canvas');cv.width=w;cv.height=Math.max(180,h);let x=cv.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,w,cv.height);x.fillStyle='#fff';x.textAlign='center';x.font='bold 26px Arial';x.fillText(title,w/2,35);x.font='bold 18px Arial';x.fillText('Count: '+list.length,w/2,65);list.forEach((n,i)=>x.fillText(n,w/2,95+i*rowH));let a=document.createElement('a');a.download='number-table.png';a.href=cv.toDataURL('image/png');a.click()}searchBtn.onclick=()=>{searched=q.value;render()};clearBtn.onclick=()=>{q.value='';searched='';render()};render();</script></body></html>
