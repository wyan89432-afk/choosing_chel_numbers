<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3 Digit Number Selector</title><style>body{font-family:Arial;margin:0;padding:16px;background:#f4f4f4}h1{text-align:center}.bar{display:flex;gap:8px;max-width:1000px;margin:auto auto 14px}.bar input{flex:1;padding:12px;font-size:16px;border:1px solid #aaa;border-radius:8px}.bar button{padding:12px;border:0;border-radius:8px;background:#ddd;cursor:pointer}.wrap{overflow:auto;background:white}.fixed{border-collapse:collapse;min-width:720px;width:100%}.fixed th,.fixed td{border:1px solid #ccc;text-align:center;padding:7px;font-weight:bold}.fixed th,.fixed td:first-child{background:#eee}.y{background:#fff176}.g{background:#69f0ae}.r{background:#ff8a80}.results{max-width:1000px;margin:18px auto}.card{background:#fff;padding:12px;margin:12px 0;border-radius:10px}.card h2{margin:0 0 8px}.count{font-size:18px;font-weight:bold;margin:0 0 10px}.auto{border-collapse:collapse;width:100%}.auto td{border:1px solid #ddd;padding:8px;text-align:center;font-weight:bold}.download{float:right;padding:7px;border:0;border-radius:6px}</style></head><body><h1>🔢 000 – 999 Number Selector</h1><div class="bar"><input id="q" placeholder="🔍 H,T,6 | H,U,5P3 | H,T,6=BK0"><button id="searchBtn">🔍 Search</button><button id="clearBtn">Clear</button></div><div class="wrap"><table class="fixed"><thead><tr><th>Row</th><script>for(let c=0;c<10;c++)document.write('<th>Column '+c+'</th>')</script></tr></thead><tbody id="body"></tbody></table></div><div class="results" id="results"></div><script>const N=Array.from({length:1000},(_,i)=>String(i).padStart(3,'0'));let searched='';const posName=['hundreds','ten','unit'];function pairRules(s){let a=[];const re=/\b(h|t|u|hd|td|ud)\s*,\s*(h|t|u|hd|td|ud)\s*,\s*([0-9])\b/gi;let m;while(m=re.exec(s)){const p=x=>/^h|^hd$/i.test(x)?0:/^t|^td$/i.test(x)?1:2;const p1=p(m[1]),p2=p(m[2]);if(p1!==p2)a.push({p1,p2,sum:Number(m[3])})}return a}function pairExtra(s){let a=[];const re=/\b(h|t|u|hd|td|ud)\s*,\s*(h|t|u|hd|td|ud)\s*,\s*([0-9])\s*p\s*([0-9])\b/gi;let m;while(m=re.exec(s)){const p=x=>/^h|^hd$/i.test(x)?0:/^t|^td$/i.test(x)?1:2;let p1=p(m[1]),p2=p(m[2]);if(p1!==p2)a.push({p1,p2,sum:Number(m[3]),digit:m[4]})}return a}function pairBk(s){let a=[];const re=/\b(h|t|u|hd|td|ud)\s*,\s*(h|t|u|hd|td|ud)\s*,\s*([0-9])\s*=\s*bk\s*([0-9])\b/gi;let m;while(m=re.exec(s)){const p=x=>/^h|^hd$/i.test(x)?0:/^t|^td$/i.test(x)?1:2;let p1=p(m[1]),p2=p(m[2]);if(p1!==p2)a.push({p1,p2,sum:Number(m[3]),bk:Number(m[4])})}return a}function rules(s){s=s.toLowerCase();let a=[];let patterns=[[/top\s*([0-9])/g,0],[/hundreds?\s+digits?\s*=?\s*([0-9])/g,0],[/\bhd\s*([0-9])/g,0],[/middle\s*([0-9])/g,1],[/ten\s+digits?\s*=?\s*([0-9])/g,1],[/\btd\s*([0-9])/g,1],[/last\s*([0-9])/g,2],[/unit\s+digits?\s*=?\s*([0-9])/g,2],[/\bud\s*([0-9])/g,2]];for(const [re,p] of patterns){let m;while(m=re.exec(s))a.push([p,m[1]])}return [...new Map(a.map(x=>[x.join(':'),x])).values()]}function bkRules(s){s=s.toLowerCase();let a=[];for(const [re,p] of [[/(?:hundreds?\s+digits?|hd)\s*([0-9])\s*=\s*bk\s*([0-9])/g,0],[/(?:ten\s+digits?|td)\s*([0-9])\s*=\s*bk\s*([0-9])/g,1],[/(?:unit\s+digits?|ud)\s*([0-9])\s*=\s*bk\s*([0-9])/g,2]]){let m;while(m=re.exec(s))a.push([p,Number(m[1]),Number(m[2])])}return a}function render(){let s=searched,rs=rules(s),bk=bkRules(s),pairs=pairRules(s),extras=pairExtra(s),pairbks=pairBk(s),b=document.getElementById('body');b.innerHTML='';for(let r=0;r<100;r++){let tr=document.createElement('tr'),h=document.createElement('td');h.textContent=String(r).padStart(2,'0');tr.append(h);for(let c=0;c<10;c++){let n=N[c*100+r],td=document.createElement('td');td.textContent=n;rs.forEach(([p,d])=>{if(n[p]===d)td.classList.add(p==0?'y':p==1?'g':'r')});tr.append(td)}b.append(tr)}let out=document.getElementById('results');out.innerHTML='';let list=N.filter(n=>rs.every(([p,d])=>n[p]===d));if(bk.length)list=list.filter(n=>bk.every(([p,d,sum])=>Number(n[p])===d&&Number(n[0])+Number(n[1])+Number(n[2])===(sum===0?10:sum)));if(pairs.length)list=list.filter(n=>pairs.every(x=>Number(n[x.p1])+Number(n[x.p2])===x.sum));if(extras.length)list=list.filter(n=>extras.every(x=>Number(n[x.p1])+Number(n[x.p2])===x.sum&&n.includes(x.digit)));if(pairbks.length)list=list.filter(n=>pairbks.every(x=>Number(n[x.p1])+Number(n[x.p2])===x.sum&&Number(n[0])+Number(n[1])+Number(n[2])===(x.bk===0?10:x.bk)));if(!rs.length&&!pairs.length&&!extras.length&&!pairbks.length)return;let title=rs.map(x=>posName[x[0]]+' digit '+x[1]).join(' = ');if(pairs.length)title=pairs.map(x=>posName[x.p1]+'+'+posName[x.p2]+'='+x.sum+' Table').join(' = ');if(extras.length)title=extras.map(x=>posName[x.p1]+'+'+posName[x.p2]+'='+x.sum+' of '+x.digit+' Table').join(' = ');if(pairbks.length)title=pairbks.map(x=>posName[x.p1]+'+'+posName[x.p2]+'='+x.sum+' of BK'+x.bk+' Table').join(' = ');if(bk.length&&!pairbks.length)title=bk.map(x=>posName[x[0]]+' digit '+x[1]+' = BK '+x[2]).join(' = ');let card=document.createElement('div');card.className='card';card.innerHTML='<button class="download">⬇ Download</button><h2>'+title+'</h2><div class="count">စုစုပေါင်း Number: '+list.length+' ခု</div>';let t=document.createElement('table');t.className='auto';list.forEach(n=>{let tr=document.createElement('tr');tr.innerHTML='<td>'+n+'</td>';t.append(tr)});card.append(t);card.querySelector('.download').onclick=()=>{let txt=title+'\nစုစုပေါင်း Number: '+list.length+' ခု\n'+list.join('\n'),blob=new Blob([txt],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=title.replace(/\s+/g,'_')+'.txt';a.click()};out.append(card)}document.getElementById('searchBtn').addEventListener('click',()=>{searched=document.getElementById('q').value;render()});document.getElementById('clearBtn').addEventListener('click',()=>{document.getElementById('q').value='';searched='';render()});render();</script></body></html>
