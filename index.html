<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3 Digit Number Selector</title><style>body{font-family:Arial;margin:0;padding:16px;background:#f4f4f4}h1{text-align:center}.bar{display:flex;gap:8px;max-width:1000px;margin:auto auto 14px}.bar input{flex:1;padding:12px;font-size:16px}.bar button{padding:12px}.wrap{overflow:auto;background:white}.fixed,.auto{border-collapse:collapse;width:100%;min-width:720px}.fixed th,.fixed td,.auto td{border:1px solid #ccc;text-align:center;padding:7px;font-weight:bold}.fixed th,.fixed td:first-child{background:#eee}.y{background:#fff176}.g{background:#69f0ae}.r{background:#ff8a80}.results{max-width:1000px;margin:18px auto}.card{background:#fff;padding:12px;margin:12px 0;border-radius:10px}.count{font-size:18px;font-weight:bold;margin:10px 0}.download{float:right}</style></head><body><h1>🔢 000 – 999 Number Selector</h1><div class="bar"><input id="q" placeholder="🔍 H,T,6 | H,U,5P3 | H,T,6=BK0"><button id="searchBtn">🔍 Search</button><button id="clearBtn">Clear</button></div><div class="wrap"><table class="fixed"><thead><tr><th>Row</th><script>for(let c=0;c<10;c++)document.write('<th>Column '+c+'</th>')</script></tr></thead><tbody id="body"></tbody></table></div><div class="results" id="results"></div><script>const N=Array.from({length:1000},(_,i)=>String(i).padStart(3,'0')),P=['hundreds','ten','unit'];let searched='';const pos=x=>/^h|^hd$/i.test(x)?0:/^t|^td$/i.test(x)?1:2;function pair(s,re){let a=[],m;re.lastIndex=0;while(m=re.exec(s)){let p1=pos(m[1]),p2=pos(m[2]);if(p1!==p2)a.push({p1,p2,sum:+m[3],digit:m[4],bk:m[4]})}return a}function pairs(s){return pair(s,/\b(h|t|u|hd|td|ud)\s*,\s*(h|t|u|hd|td|ud)\s*,\s*([0-9])\b/gi)}function extras(s){return pair(s,/\b(h|t|u|hd|td|ud)\s*,\s*(h|t|u|hd|td|ud)\s*,\s*([0-9])\s*p\s*([0-9])\b/gi)}function pbk(s){let a=[],m,re=/\b(h|t|u|hd|td|ud)\s*,\s*(h|t|u|hd|td|ud)\s*,\s*([0-9])\s*=\s*bk\s*([0-9])\b/gi;while(m=re.exec(s)){let p1=pos(m[1]),p2=pos(m[2]);if(p1!==p2)a.push({p1,p2,sum:+m[3],bk:+m[4]})}return a}function rules(s){let a=[],m,ps=[[/top\s*([0-9])/g,0],[/hundreds?\s+digits?\s*=?\s*([0-9])/g,0],[/\bhd\s*([0-9])/g,0],[/middle\s*([0-9])/g,1],[/ten\s+digits?\s*=?\s*([0-9])/g,1],[/\btd\s*([0-9])/g,1],[/last\s*([0-9])/g,2],[/unit\s+digits?\s*=?\s*([0-9])/g,2],[/\bud\s*([0-9])/g,2]];for(let [re,p] of ps)while(m=re.exec(s.toLowerCase()))a.push([p,m[1]]);return [...new Map(a.map(x=>[x.join(':'),x])).values()]}function bkRules(s){let a=[],m;for(let [re,p] of [[/(?:hundreds?\s+digits?|hd)\s*([0-9])\s*=\s*bk\s*([0-9])/gi,0],[/(?:ten\s+digits?|td)\s*([0-9])\s*=\s*bk\s*([0-9])/gi,1],[/(?:unit\s+digits?|ud)\s*([0-9])\s*=\s*bk\s*([0-9])/gi,2]])while(m=re.exec(s))a.push([p,+m[1],+m[2]]);return a}function render(){let s=searched,rs=rules(s),bk=bkRules(s),pa=pairs(s),ex=extras(s),pk=pbk(s),b=document.getElementById('body');b.innerHTML='';for(let r=0;r<100;r++){let tr=document.createElement('tr'),h=document.createElement('td');h.textContent=String(r).padStart(2,'0');tr.append(h);for(let c=0;c<10;c++){let n=N[c*100+r],td=document.createElement('td');td.textContent=n;rs.forEach(([p,d])=>{if(n[p]===d)td.classList.add(['y','g','r'][p])});tr.append(td)}b.append(tr)}let list=N.filter(n=>rs.every(([p,d])=>n[p]===d));const total=n=>(+n[0]+ +n[1]+ +n[2])%10;list=list.filter(n=>bk.every(([p,d,sum])=>n[p]==d&&total(n)==sum%10));list=list.filter(n=>pa.every(x=>((+n[x.p1]+ +n[x.p2])%10)==x.sum%10));list=list.filter(n=>ex.every(x=>((+n[x.p1]+ +n[x.p2])%10)==x.sum%10&&n.includes(x.digit)));list=list.filter(n=>pk.every(x=>((+n[x.p1]+ +n[x.p2])%10)==x.sum%10&&total(n)==x.bk%10));if(!rs.length&&!pa.length&&!ex.length&&!pk.length)return;let title=pk.map(x=>P[x.p1]+'+'+P[x.p2]+'='+x.sum+' of BK'+x.bk+' Table').join(' = ')||ex.map(x=>P[x.p1]+'+'+P[x.p2]+'='+x.sum+' of '+x.digit+' Table').join(' = ')||pa.map(x=>P[x.p1]+'+'+P[x.p2]+'='+x.sum+' Table').join(' = ')||rs.map(x=>P[x[0]]+' digit '+x[1]).join(' = ')||bk.map(x=>P[x[0]]+' digit '+x[1]+' = BK '+x[2]).join(' = ');let card=document.createElement('div');card.className='card';card.innerHTML='<button class="download">⬇ Download</button><h2>'+title+'</h2><div class="count">စုစုပေါင်း Number: '+list.length+' ခု</div>';let t=document.createElement('table');t.className='auto';list.forEach(n=>{let tr=document.createElement('tr');tr.innerHTML='<td>'+n+'</td>';t.append(tr)});card.append(t);card.querySelector('.download').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([title+'\n'+list.join('\n')],{type:'text/plain'}));a.download=title.replace(/\s+/g,'_')+'.txt';a.click()};document.getElementById('results').append(card)}searchBtn.onclick=()=>{searched=q.value;render()};clearBtn.onclick=()=>{q.value='';searched='';render()};render();</script></body></html>
