<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3 Digit Number Selector</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:12px;font-family:Arial,sans-serif;background:#f3f4f6;color:#111}h1{text-align:center;font-size:clamp(20px,4vw,30px)}.bar{display:flex;gap:8px;max-width:1100px;margin:auto auto 14px}.bar input{min-width:0;flex:1;padding:12px;font-size:16px}.bar button{padding:10px 12px}.wrap{width:100%;overflow-x:auto;background:#fff}.fixed{border-collapse:collapse;width:100%;table-layout:fixed}.fixed th,.fixed td{border:1px solid #aaa;text-align:center;padding:7px 2px;font-weight:bold;font-size:clamp(10px,1.8vw,15px);white-space:nowrap}.fixed th,.fixed td:first-child{background:#e5e7eb}.y{background:#fff176!important}.g{background:#69f0ae!important}.r{background:#ff8a80!important}.results{max-width:1100px;margin:18px auto}.card{background:white;border-radius:10px;padding:12px;margin:12px 0;overflow:auto}.count{font-weight:bold;font-size:18px;margin:10px 0}.auto{border-collapse:collapse;width:100%}.auto td{border:1px solid #ccc;text-align:center;padding:7px;font-weight:bold}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:600px){body{padding:6px}.bar{gap:5px}.bar button{font-size:12px;padding:9px 7px}.fixed th,.fixed td{padding:5px 1px;font-size:10px}}
</style>
</head>
<body>
<h1>🔢 000 – 999 Number Selector</h1>
<div class="bar"><input id="q" placeholder="H1 | T2 | U3 | H,T,4=T,U,6"><button id="searchBtn">🔍 Search</button><button id="clearBtn">Clear</button></div>
<div class="wrap"><table class="fixed"><thead><tr><th>Row</th><th>Column 0</th><th>Column 1</th><th>Column 2</th><th>Column 3</th><th>Column 4</th><th>Column 5</th><th>Column 6</th><th>Column 7</th><th>Column 8</th><th>Column 9</th></tr></thead><tbody id="body"></tbody></table></div>
<div id="results" class="results"></div>
<script>
'use strict';
const nums=Array.from({length:1000},(_,i)=>String(i).padStart(3,'0'));
const pos=x=>/^(h|hd)$/i.test(x)?0:/^(t|td)$/i.test(x)?1:2;
const mod10=x=>((x%10)+10)%10;
function makeFixed(){const body=document.getElementById('body');body.innerHTML='';for(let r=0;r<100;r++){const tr=document.createElement('tr');const row=document.createElement('td');row.textContent=String(r).padStart(2,'0');tr.appendChild(row);for(let c=0;c<10;c++){const td=document.createElement('td');td.textContent=nums[c*100+r];tr.appendChild(td)}body.appendChild(tr)}}
function parseBasic(s){const out=[];const patterns=[[/\b(?:top|h|hd|hundreds?\s+digits?)\s*=?\s*([0-9])\b/gi,0],[/\b(?:middle|t|td|ten\s+digits?)\s*=?\s*([0-9])\b/gi,1],[/\b(?:last|u|ud|unit\s+digits?)\s*=?\s*([0-9])\b/gi,2]];for(const [re,p] of patterns){let m;while((m=re.exec(s)))out.push([p,m[1]])}return out}
function parsePairs(s){const out=[];const re=/\b(h|t|u|hd|td|ud)\s*,\s*(h|t|u|hd|td|ud)\s*,\s*([0-9])\b/gi;let m;while((m=re.exec(s))){const a=pos(m[1]),b=pos(m[2]);if(a!==b)out.push({a,b,sum:+m[3]})}return out}
function render(){makeFixed();const s=document.getElementById('q').value.trim();const results=document.getElementById('results');results.innerHTML='';if(!s)return;const basic=parseBasic(s),pairs=parsePairs(s);let list=nums.filter(n=>basic.every(([p,d])=>n[p]===d)&&pairs.every(x=>mod10(+n[x.a]+ +n[x.b])===x.sum));if(!basic.length&&!pairs.length)return;const title=s+' Table';const card=document.createElement('div');card.className='card';card.innerHTML='<h2></h2><div class="count"></div>';card.querySelector('h2').textContent=title;card.querySelector('.count').textContent='စုစုပေါင်း Number: '+list.length+' ခု';const actions=document.createElement('div');actions.className='actions';const btn=document.createElement('button');btn.textContent='⬇️ Download black PNG';btn.onclick=()=>downloadPNG(title,list);actions.appendChild(btn);card.appendChild(actions);const table=document.createElement('table');table.className='auto';list.forEach(n=>{const tr=document.createElement('tr');const td=document.createElement('td');td.textContent=n;tr.appendChild(td);table.appendChild(tr)});card.appendChild(table);results.appendChild(card)}
function downloadPNG(title,list){const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');const row=32;canvas.width=800;canvas.height=Math.max(160,100+list.length*row);ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 24px Arial';ctx.fillText(title,400,32);ctx.font='bold 18px Arial';ctx.fillText('Count: '+list.length,400,62);list.forEach((n,i)=>ctx.fillText(n,400,94+i*row));const a=document.createElement('a');a.download='number-table.png';a.href=canvas.toDataURL('image/png');a.click()}
document.getElementById('searchBtn').addEventListener('click',render);document.getElementById('clearBtn').addEventListener('click',()=>{document.getElementById('q').value='';render()});makeFixed();
</script>
</body></html>
